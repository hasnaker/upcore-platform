{{- range $svcName, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: upcore-{{ $svcName }}
  labels:
    app.kubernetes.io/name: upcore-{{ $svcName }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: {{ $svc.port }}
  selector:
    app.kubernetes.io/name: upcore-{{ $svcName }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: upcore-{{ $svcName }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: upcore-{{ $svcName }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: upcore-{{ $svcName }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: upcore-{{ $svcName }}
  minReplicas: {{ $svc.replicas | default 2 }}
  maxReplicas: {{ mul ($svc.replicas | default 2) 3 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}
{{- end }}
