{{- range $svcName, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upcore-{{ $svcName }}
  labels:
    {{- include "upcore.labels" (dict "svcName" $svcName "Values" $.Values "Release" $.Release) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: upcore-{{ $svcName }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "upcore.labels" (dict "svcName" $svcName "Values" $.Values "Release" $.Release) | nindent 8 }}
    spec:
      serviceAccountName: upcore-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: app
          image: {{ include "upcore.image" (dict "svcName" $svcName "Values" $.Values) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            - name: PORT
              value: "{{ $svc.port }}"
            - name: ENVIRONMENT
              value: {{ $.Values.global.env | quote }}
            - name: LOG_LEVEL
              value: {{ $.Values.global.logLevel | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ $.Values.global.databaseSecretRef }}, key: url }
            - name: SERVICE_BUS_CONNECTION_STRING
              valueFrom:
                secretKeyRef: { name: {{ $.Values.global.serviceBusSecretRef }}, key: conn }
          readinessProbe:
            httpGet:  { path: /ready,  port: {{ $svc.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:  { path: /health, port: {{ $svc.port }} }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: upcore-{{ $svcName }}
{{- end }}
{{- end }}
