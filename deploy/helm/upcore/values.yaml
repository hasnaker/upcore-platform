# Default (dev) values. Production için values-prod.yaml.
# Her servis aynı template'den türer; farkları burada override et.

global:
  imageRegistry: upcoreprodacr.azurecr.io
  imageTag: "latest"
  imagePullPolicy: IfNotPresent
  env: development
  logLevel: debug
  databaseSecretRef: upcore-db-url
  serviceBusSecretRef: upcore-servicebus-conn
  clerkSecretRef: upcore-clerk-keys
  azureClientId: ""

services:
  api-gateway:
    enabled: true
    port: 8080
    replicas: 2
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    ingress:
      enabled: true
      host: api.upcore.app
      path: /api/v1/

  auth:
    enabled: true
    port: 8001
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi

  tenant:
