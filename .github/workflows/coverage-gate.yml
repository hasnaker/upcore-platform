name: Coverage Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  go-coverage:
    name: Go ${{ matrix.service }} >= 80%
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - audit
          - auth
          - intervention
          - notification
          - performance
          - mobility
          - survey
          - tenant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: true
      - name: Run tests with coverage
        working-directory: services/${{ matrix.service }}
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Enforce threshold
        working-directory: services/${{ matrix.service }}
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | sed 's/%//')
          echo "Coverage for ${{ matrix.service }}: ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 80.0) exit 1 }'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.out

  python-coverage:
    name: Python ${{ matrix.svc }} >= 80%
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        svc:
          - burnout-prediction
          - psychometric-scoring
          - recommendation
          - retraining
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: ml-services/${{ matrix.svc }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov numpy pandas scikit-learn
      - name: Run pytest with coverage
        working-directory: ml-services/${{ matrix.svc }}
        run: |
          pytest --cov=. --cov-report=term --cov-report=xml --cov-fail-under=80 || exit 1
