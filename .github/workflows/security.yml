# ============================================================================
# UpCore — Security CI (SSDLC)
# SAST + SCA + secrets + containers + license audit on every PR and nightly.
# Owners: security-engineering@upcore.io
# ============================================================================

name: Security

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    # Nightly full scan (02:17 UTC) — matches on-call Europe/Istanbul off-hours.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # --------------------------------------------------------------------------
  # 1. Semgrep SAST — Go + TypeScript + Python + UpCore custom ruleset
  # --------------------------------------------------------------------------
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (curated + custom rules)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/ci \
            --config p/golang \
            --config p/typescript \
            --config p/react \
            --config p/python \
            --config p/secrets \
            --config .github/semgrep/upcore-rules.yml \
            --sarif --output=semgrep.sarif \
            --error --severity=ERROR --metrics=off

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # --------------------------------------------------------------------------
  # 2. gosec — Go-specific security linter
  # --------------------------------------------------------------------------
  gosec:
    name: gosec (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Scan all Go services + packages
        run: |
          set +e
          FAIL=0
          for dir in services/*/ packages/go/*/; do
            [ -f "${dir}go.mod" ] || continue
            echo "::group::gosec ${dir}"
            (cd "$dir" && gosec -fmt=sarif -out=gosec.sarif -severity=medium ./...) || FAIL=1
            echo "::endgroup::"
          done
          exit $FAIL

      - name: Upload SARIF (best effort)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: services/auth/gosec.sarif
          category: gosec
        continue-on-error: true

  # --------------------------------------------------------------------------
  # 3. bandit — Python SAST for ml-services
  # --------------------------------------------------------------------------
  bandit:
    name: bandit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install "bandit[sarif,toml]==1.7.9"

      - name: Run bandit on ml-services
        run: |
          bandit -r ml-services/ \
            -c .github/bandit.yml \
            -f sarif -o bandit.sarif \
            --severity-level medium --confidence-level medium || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  # --------------------------------------------------------------------------
  # 4. Secret scanning — gitleaks + trufflehog (defense in depth)
  # --------------------------------------------------------------------------
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail

  # --------------------------------------------------------------------------
  # 5. Snyk — dependency + IaC scan (requires SNYK_TOKEN secret)
  # --------------------------------------------------------------------------
  snyk:
    name: Snyk SCA
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - kind: node
            path: .
          - kind: go
            path: services/auth
          - kind: go
            path: services/api-gateway
          - kind: go
            path: services/billing
          - kind: python
            path: ml-services/burnout-prediction
    steps:
      - uses: actions/checkout@v4
      - name: Snyk ${{ matrix.target.kind }} (${{ matrix.target.path }})
        uses: snyk/actions/${{ matrix.target.kind }}@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-${{ matrix.target.kind }}.sarif
          command: test
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-${{ matrix.target.kind }}.sarif
          category: snyk-${{ matrix.target.kind }}

  # --------------------------------------------------------------------------
  # 6. Trivy — container image scan (filesystem mode on PRs, image on releases)
  # --------------------------------------------------------------------------
  trivy:
    name: Trivy (filesystem + config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy config (IaC, Dockerfile, k8s)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH

      - name: Upload SARIF (fs)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload SARIF (config)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # --------------------------------------------------------------------------
  # 7. FOSSA — license audit (requires FOSSA_API_KEY)
  # --------------------------------------------------------------------------
  fossa:
    name: FOSSA license audit
    runs-on: ubuntu-latest
    if: ${{ secrets.FOSSA_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: fossa-contrib/fossa-action@v3
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
      - uses: fossa-contrib/fossa-action@v3
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true

  # --------------------------------------------------------------------------
  # 8. SBOM — CycloneDX output, uploaded as artifact (release workflow signs it)
  # --------------------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM
        run: bash scripts/generate-sbom.sh
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: upcore-sbom-${{ github.sha }}
          path: sbom/
          retention-days: 90

  # --------------------------------------------------------------------------
  # Status gate — every required scan must pass.
  # --------------------------------------------------------------------------
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [semgrep, gosec, bandit, gitleaks, trufflehog, trivy, sbom]
    steps:
      - name: Enforce required results
        run: |
          for r in \
            "${{ needs.semgrep.result }}" \
            "${{ needs.gosec.result }}" \
            "${{ needs.bandit.result }}" \
            "${{ needs.gitleaks.result }}" \
            "${{ needs.trufflehog.result }}" \
            "${{ needs.trivy.result }}" \
            "${{ needs.sbom.result }}"
          do
            if [ "$r" = "failure" ]; then
              echo "::error::Security check failed ($r)"
              exit 1
            fi
          done
          echo "All security gates passed."
