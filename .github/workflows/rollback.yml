# ============================================================================
# Upcore V1 — Rollback
# Manual trigger: rollback Container App to previous revision
# ============================================================================

name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - prod
      services:
        description: "Services to rollback (comma-separated, or 'all')"
        required: false
        type: string
        default: "all"
      revision:
        description: "Target revision name (leave empty for previous revision)"
        required: false
        type: string
        default: ""
      deployment_artifact:
        description: "Deployment artifact name (from production workflow) for bulk rollback"
        required: false
        type: string
        default: ""

concurrency:
  group: rollback-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: upc-${{ inputs.environment }}-rg

jobs:
  # --------------------------------------------------------------------------
  # Rollback services
  # --------------------------------------------------------------------------
  rollback:
    name: Rollback (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ inputs.environment == 'prod' && secrets.AZURE_CREDENTIALS_PROD || secrets.AZURE_CREDENTIALS_STAGING }}

      - name: Resolve services
        id: services
        run: |
          INPUT="${{ inputs.services }}"
          if [[ "$INPUT" == "all" ]] || [[ -z "$INPUT" ]]; then
            LIST="api-gateway,auth,tenant,organization,employee,leave,survey,assessment,document,notification,audit,intervention,mobility,ats,burnout-prediction,psychometric-scoring,recommendation,action-center,web,admin"
          else
            LIST="$INPUT"
          fi
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "Rolling back: $LIST"

      - name: Download rollback artifact
        if: inputs.deployment_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.deployment_artifact }}
          path: /tmp/rollback/
        continue-on-error: true

      - name: Get current state
        id: current
        run: |
          ENV="${{ inputs.environment }}"
          RG="upc-${ENV}-rg"
          IFS=',' read -ra SERVICES <<< "${{ steps.services.outputs.list }}"

          echo "## Current State" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Current Revision | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-----------------|--------|" >> "$GITHUB_STEP_SUMMARY"

          for service in "${SERVICES[@]}"; do
            REVISION=$(az containerapp show \
              --name "upc-${ENV}-${service}" \
              --resource-group "$RG" \
              --query "properties.latestRevisionName" -o tsv 2>/dev/null || echo "unknown")
            STATUS=$(az containerapp show \
              --name "upc-${ENV}-${service}" \
              --resource-group "$RG" \
              --query "properties.runningStatus" -o tsv 2>/dev/null || echo "unknown")
            echo "| $service | $REVISION | $STATUS |" >> "$GITHUB_STEP_SUMMARY"
            echo "Current: $service -> $REVISION ($STATUS)"
          done

      - name: Rollback services
        run: |
          ENV="${{ inputs.environment }}"
          RG="upc-${ENV}-rg"
          TARGET_REVISION="${{ inputs.revision }}"
          IFS=',' read -ra SERVICES <<< "${{ steps.services.outputs.list }}"

          FAILED=0
          for service in "${SERVICES[@]}"; do
            APP_NAME="upc-${ENV}-${service}"
            echo "=== Rolling back $service ==="

            if [[ -n "$TARGET_REVISION" ]]; then
              # Rollback to specified revision
              REVISION="$TARGET_REVISION"
            elif [[ -f "/tmp/rollback/${service}" ]]; then
              # Rollback to artifact-saved revision
              REVISION=$(cat "/tmp/rollback/${service}")
            else
              # Get previous revision (second most recent)
              REVISION=$(az containerapp revision list \
                --name "$APP_NAME" \
                --resource-group "$RG" \
                --query "sort_by([?properties.active], &properties.createdTime) | [-2].name" \
                -o tsv 2>/dev/null || echo "")
            fi

            if [[ -z "$REVISION" ]] || [[ "$REVISION" == "none" ]] || [[ "$REVISION" == "null" ]]; then
              echo "::warning::No previous revision found for $service, skipping"
              continue
            fi

            echo "Target revision: $REVISION"

            # Activate the target revision
            az containerapp revision activate \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision "$REVISION" \
              --output none 2>/dev/null || true

            # Shift 100% traffic to the target revision
            az containerapp ingress traffic set \
              --name "$APP_NAME" \
              --resource-group "$RG" \
              --revision-weight "${REVISION}=100" \
              --output none

            if [[ $? -eq 0 ]]; then
              echo "Rolled back $service to $REVISION"
            else
              echo "::error::Failed to rollback $service"
              FAILED=$((FAILED + 1))
            fi
          done

          if [[ $FAILED -gt 0 ]]; then
            echo "::error::$FAILED rollbacks failed"
            exit 1
          fi

      - name: Verify rollback
        run: |
          ENV="${{ inputs.environment }}"
          RG="upc-${ENV}-rg"
          IFS=',' read -ra SERVICES <<< "${{ steps.services.outputs.list }}"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Post-Rollback State" >> "$GITHUB_STEP_SUMMARY"
          echo "| Service | Active Revision | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|----------------|--------|" >> "$GITHUB_STEP_SUMMARY"

          ALL_OK=true
          for service in "${SERVICES[@]}"; do
            REVISION=$(az containerapp show \
              --name "upc-${ENV}-${service}" \
              --resource-group "$RG" \
              --query "properties.latestReadyRevisionName" -o tsv 2>/dev/null || echo "unknown")
            STATUS=$(az containerapp show \
              --name "upc-${ENV}-${service}" \
              --resource-group "$RG" \
              --query "properties.runningStatus" -o tsv 2>/dev/null || echo "unknown")
            echo "| $service | $REVISION | $STATUS |" >> "$GITHUB_STEP_SUMMARY"

            if [[ "$STATUS" != "Running" ]]; then
              ALL_OK=false
            fi
          done

          if [[ "$ALL_OK" != "true" ]]; then
            echo "::warning::Some services are not in Running state after rollback"
          fi

      - name: Smoke test
        run: |
          ENV="${{ inputs.environment }}"
          RG="upc-${ENV}-rg"

          GATEWAY_FQDN=$(az containerapp show \
            --name "upc-${ENV}-api-gateway" \
            --resource-group "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${GATEWAY_FQDN}/healthz" --max-time 15 || echo "000")
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "::error::Gateway health check failed after rollback: $HTTP_STATUS"
            exit 1
          fi
          echo "Post-rollback health check passed"
