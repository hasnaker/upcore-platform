# ============================================================================
# Upcore V1 — Staging Deployment
# On merge to main: build Docker images, push to GHCR, deploy to staging
# ============================================================================

name: Deploy to Staging

on:
  push:
    branches: [main]

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "9"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/upcore
  ENVIRONMENT: staging
  AZURE_RESOURCE_GROUP: upc-staging-rg

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # Build and push Go service images
  # --------------------------------------------------------------------------
  build-go:
    name: Build Go - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth
          - tenant
          - organization
          - employee
          - leave
          - survey
          - assessment
          - document
          - notification
          - audit
          - intervention
          - mobility
          - ats
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            GO_VERSION=${{ env.GO_VERSION }}
            SERVICE_NAME=${{ matrix.service }}

  # --------------------------------------------------------------------------
  # Build and push Python ML service images
  # --------------------------------------------------------------------------
  build-python:
    name: Build Python - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - burnout-prediction
          - psychometric-scoring
          - recommendation
          - action-center
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ml-services/${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}

  # --------------------------------------------------------------------------
  # Build and push web app image
  # --------------------------------------------------------------------------
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            NEXT_PUBLIC_API_URL=https://staging.upcore.io/api
            NEXT_PUBLIC_ENVIRONMENT=staging

  # --------------------------------------------------------------------------
  # Deploy all services to staging Container Apps
  # --------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-go, build-python, build-web]
    environment:
      name: staging
      url: https://staging.upcore.io
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}

      - name: Get image tag
        id: tag
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=staging-sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Deploy Go services
        run: |
          services=(
            "api-gateway" "auth" "tenant" "organization" "employee"
            "leave" "survey" "assessment" "document" "notification"
            "audit" "intervention" "mobility" "ats"
          )
          for service in "${services[@]}"; do
            echo "Deploying $service..."
            az containerapp update \
              --name "upc-staging-${service}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --image "${{ env.IMAGE_PREFIX }}/${service}:${{ steps.tag.outputs.tag }}" \
              --output none &
          done
          wait
          echo "All Go services deployed"

      - name: Deploy Python ML services
        run: |
          services=("burnout-prediction" "psychometric-scoring" "recommendation" "action-center")
          for service in "${services[@]}"; do
            echo "Deploying $service..."
            az containerapp update \
              --name "upc-staging-${service}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --image "${{ env.IMAGE_PREFIX }}/${service}:${{ steps.tag.outputs.tag }}" \
              --output none &
          done
          wait
          echo "All Python services deployed"

      - name: Deploy web apps
        run: |
          for app in web admin; do
            echo "Deploying $app..."
            az containerapp update \
              --name "upc-staging-${app}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --image "${{ env.IMAGE_PREFIX }}/${app}:${{ steps.tag.outputs.tag }}" \
              --output none &
          done
          wait
          echo "All web apps deployed"

      - name: Verify deployments
        run: |
          echo "Verifying staging deployments..."
          services=(
            "api-gateway" "auth" "tenant" "organization" "employee"
            "leave" "survey" "assessment" "document" "notification"
            "audit" "intervention" "mobility" "ats"
            "burnout-prediction" "psychometric-scoring" "recommendation" "action-center"
            "web" "admin"
          )
          FAILED=0
          for service in "${services[@]}"; do
            STATUS=$(az containerapp show \
              --name "upc-staging-${service}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "properties.runningStatus" -o tsv 2>/dev/null || echo "Unknown")
            if [[ "$STATUS" != "Running" ]]; then
              echo "::warning::Service $service status: $STATUS"
              FAILED=$((FAILED + 1))
            else
              echo "Service $service: Running"
            fi
          done
          if [[ $FAILED -gt 0 ]]; then
            echo "::warning::$FAILED services are not in Running state"
          fi

      - name: Smoke test
        run: |
          echo "Running smoke tests against staging..."
          GATEWAY_FQDN=$(az containerapp show \
            --name "upc-staging-api-gateway" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          # Health check
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${GATEWAY_FQDN}/healthz" --max-time 10 || echo "000")
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "::error::Gateway health check failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Gateway health check passed"

  # --------------------------------------------------------------------------
  # Notify on completion
  # --------------------------------------------------------------------------
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: always()
    steps:
      - name: Summary
        run: |
          if [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
            echo "## Staging Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
            echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "URL: https://staging.upcore.io" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Staging Deployment Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." >> "$GITHUB_STEP_SUMMARY"
          fi
