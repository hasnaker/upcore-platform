name: marketing-screenshots

on:
  schedule:
    # Nightly at 02:00 UTC — regenerates baseline screenshots for marketing site.
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/screenshots/**'
      - 'scripts/seed-demo*'
      - 'apps/web/src/app/**'
      - '.github/workflows/screenshots.yml'

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: upcore
          POSTGRES_PASSWORD: upcore_dev_password
          POSTGRES_DB: upcore_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://upcore:upcore_dev_password@localhost:5432/upcore_dev?sslmode=disable
      DEMO_SEED_ALLOW: '1'
      SCREENSHOT_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_E2E_BYPASS_AUTH: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: false

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: make -C database migrate-up

      - name: Seed demo tenant
        run: ./scripts/seed-demo.sh

      - name: Install Playwright browsers
        run: pnpm --filter @upcore/screenshots exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter @upcore/web build

      - name: Capture screenshots
        run: make screenshots-capture

      - name: Verify outputs
        run: make screenshots-verify

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-screenshots
          path: apps/marketing/public/screenshots/
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/screenshots/playwright-report/
          retention-days: 7
