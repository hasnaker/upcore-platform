# Lighthouse CI — apps/web Core Web Vitals + SEO bütçesi
#
# Tetikleyici: her PR'da çalışır, .lighthouserc.json'da tanımlı eşikleri aşan
# herhangi bir metrik PR'ı kırmaz (assertions: warn) ama Slack #frontend-perf
# kanalına otomatik raporlar.
#
# Eşikler (Pareto: ilk-ekran kullanıcı algısına en çok etki edenler):
#   - LCP <2500ms       (Core Web Vital — Good)
#   - CLS <0.1          (Core Web Vital — Good)
#   - INP <200ms        (Core Web Vital — Good, FID yerine)
#   - SEO score >=95    (meta tag + a11y minimum)
#
# Local çalıştırma:
#   pnpm --filter @upcore/web build && pnpm --filter @upcore/web start &
#   npx @lhci/cli@0.13 autorun

name: Lighthouse CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/design-system/**'
      - '.github/workflows/lighthouse.yml'
      - '.lighthouserc.json'

jobs:
  lighthouse:
    name: Lighthouse audit (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps/web
        env:
          # Lighthouse'u rahatsız eden Sentry source-map upload'ı CI'da kapalı
          SENTRY_AUTH_TOKEN: ''
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.LH_CLERK_PUBLISHABLE_KEY || 'pk_test_dummy' }}
          CLERK_SECRET_KEY: ${{ secrets.LH_CLERK_SECRET_KEY || 'sk_test_dummy' }}
        run: pnpm --filter @upcore/web build

      - name: Start production server (background)
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.LH_CLERK_PUBLISHABLE_KEY || 'pk_test_dummy' }}
          CLERK_SECRET_KEY: ${{ secrets.LH_CLERK_SECRET_KEY || 'sk_test_dummy' }}
        run: |
          pnpm --filter @upcore/web start &
          # Ready bekleme — naive sleep yerine HTTP probe
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Server ready"
              break
            fi
            sleep 2
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/blog
            http://localhost:3000/giris
          budgetPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
