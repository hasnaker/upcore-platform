name: Load Test — Nightly

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch:

jobs:
  k6-baseline:
    name: k6 baseline + pulse + admin + ml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run scenarios
        env:
          K6_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          K6_TOKEN: ${{ secrets.STAGING_LOAD_TOKEN }}
          K6_TENANT_ID: ${{ secrets.STAGING_TENANT_ID }}
          K6_ML_BASE_URL: ${{ secrets.STAGING_ML_BASE_URL }}
          K6_ML_TOKEN: ${{ secrets.STAGING_ML_TOKEN }}
          K6_PROMETHEUS_RW_SERVER_URL: ${{ secrets.PROM_REMOTE_WRITE_URL }}
        run: |
          set -euo pipefail
          for script in tests/load/scenarios/pulse_submit_1000vu.js tests/load/scenarios/admin_dashboard_100vu.js tests/load/scenarios/ml_inference_50rps.js; do
            name=$(basename "$script" .js)
            k6 run \
              --out experimental-prometheus-rw \
              --tag scenario="$name" \
              --summary-export="results-$name.json" \
              "$script"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: k6-summaries
          path: results-*.json

      - name: Trend comment
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::notice ::k6 nightly summaries uploaded; see Grafana dashboard 'upcore-load-trend'."
