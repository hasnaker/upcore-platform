# ============================================================================
# UpCore Dependabot config
# Weekly updates, security advisories opened immediately.
# ============================================================================
version: 2
updates:
  # --- GitHub Actions -------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Istanbul
    labels: ["deps", "ci"]
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5

  # --- Node / TS workspace root --------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Europe/Istanbul
    labels: ["deps", "ts"]
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "chore(deps)"
    groups:
      next:
        patterns: ["next", "@next/*", "react", "react-dom"]
      types:
        patterns: ["@types/*"]
      tooling:
        patterns: ["eslint*", "prettier", "typescript", "vitest", "@playwright/*"]
    open-pull-requests-limit: 15

  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    labels: ["deps", "ts", "apps/web"]

  - package-ecosystem: npm
    directory: "/apps/admin"
    schedule:
      interval: weekly
    labels: ["deps", "ts", "apps/admin"]

  - package-ecosystem: npm
    directory: "/apps/marketing"
    schedule:
      interval: weekly
    labels: ["deps", "ts", "apps/marketing"]

  # --- Go services (17 modules) --------------------------------------------
