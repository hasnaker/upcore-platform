# ============================================================================
# api-gateway routes — DOCKER COMPOSE variant
# ----------------------------------------------------------------------------
# Bu dosya docker compose içinde kullanılır. Target URL'leri service DNS
# isimlerini (auth, employee, ...) kullanır. Lokal `go run` için
# routes.yaml kullan.
# ============================================================================

routes:
  - path_prefix: "/api/v1/auth"
    upstream: "auth"
    target: "http://auth:8001"
    auth_required: false
    timeout: 30s
    rate_limit: { per_user: 10, per_tenant: 100 }
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]

  - path_prefix: "/webhooks/clerk"
    upstream: "auth"
    target: "http://auth:8001"
    auth_required: false
    timeout: 30s
    rate_limit: { per_user: 0, per_tenant: 0 }
    methods: ["POST"]

  - path_prefix: "/api/v1/tenants"
    upstream: "tenant"
    target: "http://tenant:8002"
    auth_required: true
    timeout: 30s
    rate_limit: { per_user: 100, per_tenant: 1000 }
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]

  - path_prefix: "/api/v1/employees"
