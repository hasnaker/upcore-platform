routes:
  # Authentication service
  - path_prefix: "/api/v1/auth"
    upstream: "auth"
    target: "http://localhost:8001"
    auth_required: false # auth endpoints handle their own auth
    timeout: 30s
    rate_limit:
      per_user: 10
      per_tenant: 100
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]

  # Clerk webhooks (no JWT)
  - path_prefix: "/webhooks/clerk"
    upstream: "auth"
    target: "http://localhost:8001"
    auth_required: false
    timeout: 30s
    rate_limit:
      per_user: 0
      per_tenant: 0
    methods: ["POST"]

  # Tenant service
  - path_prefix: "/api/v1/tenants"
    upstream: "tenant"
    target: "http://localhost:8002"
    auth_required: true
    timeout: 30s
    rate_limit:
      per_user: 100
      per_tenant: 1000
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]

