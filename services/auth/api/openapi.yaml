openapi: 3.1.0
info:
  title: Upcore Auth Service
  description: |
    Authentication & authorization microservice for Upcore V1.
    Handles Clerk webhook processing, JWT validation, RBAC enforcement, and session management.
  version: 1.0.0
  contact:
    name: Upcore Platform Team
servers:
  - url: http://localhost:8001
    description: Local development
  - url: https://auth.upcore.app
    description: Production

tags:
  - name: health
  - name: webhooks
  - name: users
  - name: permissions
  - name: sessions

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  timestamp: { type: string, format: date-time }

  /ready:
    get:
      tags: [health]
      summary: Readiness probe
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ready" }

  /webhooks/clerk:
    post:
      tags: [webhooks]
      summary: Clerk webhook receiver
      description: |
        Receives and verifies Clerk webhook events (user.created, user.updated,
        user.deleted, session.revoked) using Svix HMAC-SHA256 signatures.
      parameters:
        - in: header
          name: Svix-Id
          required: true
          schema: { type: string }
        - in: header
          name: Svix-Timestamp
          required: true
          schema: { type: string }
        - in: header
          name: Svix-Signature
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClerkEvent'
      responses:
        '200':
          description: Event processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  type: { type: string }
        '400':
          description: Bad request (stale timestamp, invalid payload)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Dispatch failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/me:
    get:
      tags: [users]
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth/users/me:
    get:
      tags: [users]
      summary: Alias for /me
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }

  /api/v1/auth/check:
    get:
      tags: [permissions]
      summary: Permission check
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: action
          required: true
          schema: { type: string, example: "read:employees" }
        - in: query
          name: resource
          required: true
          schema: { type: string, example: "tenant" }
      responses:
        '200':
          description: Decision returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckDecision' }
        '400':
          description: Missing parameters
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [permissions]
      summary: Permission check (body)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, resource]
              properties:
                action: { type: string }
                resource: { type: string }
      responses:
        '200':
          description: Decision returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckDecision' }

  /api/v1/auth/sessions/current:
    get:
      tags: [sessions]
      summary: Current session identity (from JWT)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentSession' }

  /api/v1/auth/sessions:
    get:
      tags: [sessions]
      summary: List active refresh-token sessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
    delete:
      tags: [sessions]
      summary: Revoke all sessions (logout-all)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }

  /api/v1/auth/sessions/{id}:
    delete:
      tags: [sessions]
      summary: Revoke a specific session
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Revoked
        '403':
          description: Not owner
        '404':
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    ClerkEvent:
      type: object
      properties:
        type: { type: string, example: "user.created" }
        object: { type: string, example: "event" }
        data: { type: object, additionalProperties: true }
        timestamp: { type: integer, format: int64 }

    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        locale: { type: string }
        status: { type: string, enum: [active, suspended, deleted, invited] }
        tenant_id: { type: string, format: uuid }
        roles:
          type: array
          items: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CheckDecision:
      type: object
      properties:
        allowed: { type: boolean }
        reason: { type: string }
        action: { type: string }
        resource: { type: string }
        roles:
          type: array
          items: { type: string }

    CurrentSession:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        roles:
          type: array
          items: { type: string }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        user_agent: { type: string }
        ip_address: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
