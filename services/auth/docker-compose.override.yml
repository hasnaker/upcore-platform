version: "3.9"
# Local-dev overlay for the auth service.
# Usage (from services/auth):
#   docker compose -f ../../infrastructure/docker-compose.yml -f docker-compose.override.yml up auth

services:
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upcore-auth
    environment:
      PORT: "8001"
      APP_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgres://upcore:upcore_dev_password@postgres:5432/upcore_dev?sslmode=disable
      REDIS_URL: redis://:upcore_redis_dev@redis:6379/0
      CLERK_WEBHOOK_SECRET: ""
      CLERK_ISSUER: https://clerk.upcore.app
      JWT_AUDIENCE: upcore-api
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL: "720h"
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - upcore-net
