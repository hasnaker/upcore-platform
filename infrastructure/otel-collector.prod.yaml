receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s
  memory_limiter:
    check_interval: 5s
    limit_mib: 1024
    spike_limit_mib: 256
  resource:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert

exporters:
  # Azure Application Insights (production). The Azure Monitor exporter in
  # OTel Collector Contrib maps OTLP spans/metrics to App Insights telemetry
  # directly — no Azure SDK dependency in the Go services required.
  azuremonitor:
    instrumentation_key: ${APPINSIGHTS_INSTRUMENTATION_KEY}
    # connection_string takes precedence when set; prefer it for new
    # workspaces: "InstrumentationKey=...;IngestionEndpoint=https://…"
    # connection_string: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
    max_batch_size: 100
    max_batch_interval: 10s

  # Always keep a debug fallback for smoke tests.
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [azuremonitor, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [azuremonitor]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [azuremonitor]
