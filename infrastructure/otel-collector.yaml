receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128
  resource:
    attributes:
      - key: deployment.environment
        value: dev
        action: upsert

exporters:
  # Dev: console + future OTLP ship-out. Production Azure Monitor / Jaeger / Tempo.
  debug:
    verbosity: normal
  # prometheus format so /metrics can scrape span-derived metrics (optional)
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [debug, prometheus]
