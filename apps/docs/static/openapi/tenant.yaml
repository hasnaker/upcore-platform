openapi: 3.1.0
info:
  title: Upcore Tenant Service
  version: "1.0.0"
  description: Organization signup, subscription plans, billing webhooks, and usage tracking.
servers:
  - url: http://localhost:8002
    description: Local dev
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: ok
  /signup:
    post:
      summary: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "409":
          description: slug_taken
        "422":
          description: validation_error
  /plans:
    get:
      summary: List active plans
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
                  count:
                    type: integer
  /plans/{id}:
    get:
      summary: Get plan detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "404":
          description: not_found
  /tenants/me:
    get:
      summary: Current tenant
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
  /tenants/{id}:
    get:
      summary: Get tenant by id
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: not_found
    patch:
      summary: Update tenant profile
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                locale: { type: string }
      responses:
        "200":
          description: ok
    delete:
      summary: Schedule tenant deletion (30d grace)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: accepted
  /subscriptions/current:
    get:
      summary: Current subscription + plan
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: ok
  /subscriptions:
    post:
      summary: Change plan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id: { type: string }
              required: [plan_id]
      responses:
        "200":
          description: ok
        "404":
          description: plan_not_found
  /subscriptions/cancel:
    post:
      summary: Cancel at period end
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: ok
  /subscriptions/resume:
    post:
      summary: Undo cancellation
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: ok
  /subscriptions/seats:
    patch:
      summary: Update seat count
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seats: { type: integer }
              required: [seats]
      responses:
        "200":
          description: ok
        "402":
          description: seat_cap_reached
  /usage:
    get:
      summary: Current period usage
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
  /onboarding/progress:
    get:
      summary: Get or create the in-progress onboarding draft for the current Clerk user
      description: |
        Returns the active draft for the Clerk user identified by the
        X-Clerk-User-ID header (or X-User-ID fallback). Creates a fresh
        draft if none exists. Pre-tenant: no tenant context required.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingDraft"
        "401":
          description: unauthorized
  /onboarding/progress/{step}:
    post:
      summary: Save the payload for a single wizard step
      parameters:
        - in: path
          name: step
          required: true
          schema: { type: integer, minimum: 1, maximum: 10 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingData"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingDraft"
        "401":
          description: unauthorized
        "422":
          description: validation_error
  /onboarding/commit:
    post:
      summary: Finalize the wizard — create tenant + subscription + modules
      description: |
        Commits the in-progress draft into a live tenant. Publishes
        tenant.created.v1, tenant.admin_invited.v1, and
        tenant.onboarding.committed.v1 (containing the resolved template,
        org chart, KVKK notices, payroll, SSO, integrations, and any
        drafted employees) so downstream services can seed.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                draft_id:
                  type: string
                  format: uuid
                  description: Optional — overrides the user's in-progress draft.
      responses:
        "201":
          description: tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingCommitResult"
        "401":
          description: unauthorized
        "409":
          description: slug_taken | already_committed
        "422":
          description: validation_error
  /onboarding/abandon:
    post:
      summary: Abandon the in-progress draft (idempotent)
      responses:
        "204":
          description: no content
  /admin/onboarding/funnel:
    get:
      summary: (Admin) Aggregate funnel counts by step/status over the last N days
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingFunnelAggregate"
  /admin/tenants:
    get:
      summary: (Admin) List all tenants with plan + employee count
      description: |
        Platform-admin only. Returns a paginated admin view across all
        tenants with their latest subscription plan and current employee
        usage counter joined in. Soft-deleted tenants are excluded.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [all, trial, active, suspended, deleted] }
        - in: query
          name: plan
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
          description: Case-insensitive search over name/slug.
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantList"
        "400":
          description: bad_request
        "403":
          description: forbidden — platform-admin role required
  /admin/tenants/{id}:
    get:
      summary: (Admin) Get tenant detail with subscription + usage
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantDetail"
        "400":
          description: bad_uuid
        "403":
          description: forbidden
        "404":
          description: not_found
  /admin/tenants/{id}/status:
    patch:
      summary: (Admin) Suspend / activate / resume a tenant
      description: |
        Platform-admin only. Transitions tenant between trial, active,
        and suspended. Requires `reason` when transitioning to suspended.
        Emits `tenant.suspended.v1` or `tenant.activated.v1` events (audit).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeStatusRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: bad_request
        "403":
          description: forbidden
        "404":
          description: not_found
        "422":
          description: validation_error (invalid status, no-op, missing reason)
  /webhooks/billing:
    post:
      summary: Billing provider webhook
      parameters:
        - in: query
          name: provider
          schema: { type: string, enum: [stripe, iyzico] }
      responses:
        "200":
          description: ok
        "401":
          description: invalid_signature
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SignupRequest:
      type: object
      required: [company_name, company_slug, admin_email, admin_first_name, admin_last_name, plan_id]
      properties:
        company_name: { type: string }
        company_slug: { type: string }
        admin_email: { type: string, format: email }
        admin_first_name: { type: string }
        admin_last_name: { type: string }
        plan_id: { type: string }
        country: { type: string }
        locale: { type: string }
        vkn: { type: string }
        tckn: { type: string }
    SignupResponse:
      type: object
      properties:
        tenant_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        slug: { type: string }
        signup_token: { type: string }
        trial_ends_at: { type: string, format: date-time }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        country: { type: string }
        locale: { type: string }
        status: { type: string, enum: [trial, active, suspended, deleted] }
        trial_ends_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Plan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        tier: { type: string, enum: [free, starter, growth, platform, enterprise] }
        price_monthly: { type: integer, nullable: true }
        features: { type: object }
        is_active: { type: boolean }
    AdminTenantRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        country: { type: string }
        locale: { type: string }
        status: { type: string, enum: [trial, active, suspended, deleted] }
        trial_ends_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        plan_id: { type: string, nullable: true }
        subscription_status: { type: string, nullable: true }
        seats: { type: integer, nullable: true }
        employee_count: { type: integer }
    AdminTenantList:
      type: object
      required: [items, total, page, page_size, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminTenantRow"
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        has_more: { type: boolean }
    AdminTenantDetail:
      type: object
      required: [tenant, usage]
      properties:
        tenant:
          $ref: "#/components/schemas/Tenant"
        subscription:
          type: object
          nullable: true
        plan:
          $ref: "#/components/schemas/Plan"
        usage:
          type: array
          items:
            type: object
    ChangeStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended, trial]
        reason:
          type: string
          description: Required when status=suspended. Persisted into the audit event payload.
    OnboardingDraft:
      type: object
      required: [id, clerk_user_id, admin_email, current_step, status, data, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        clerk_user_id: { type: string }
        admin_email: { type: string, format: email }
        current_step: { type: integer, minimum: 1, maximum: 10 }
        status:
          type: string
          enum: [in_progress, committed, abandoned]
        committed_tenant_id:
          type: string
          format: uuid
          nullable: true
        data:
          $ref: "#/components/schemas/OnboardingData"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OnboardingData:
      type: object
      description: JSONB payload of the wizard. All fields optional; filled in as the user progresses.
      properties:
        company:
          type: object
          properties:
            name: { type: string }
            slug: { type: string }
            vkn: { type: string }
            sector: { type: string }
            employee_count_band: { type: string, enum: ["1-10", "11-50", "51-200", "201-1000", "1000+"] }
            country: { type: string }
            locale: { type: string }
        admin:
          type: object
          properties:
            email: { type: string, format: email }
            first_name: { type: string }
            last_name: { type: string }
            phone: { type: string }
            two_fa_ack: { type: boolean }
        plan:
          type: object
          properties:
            plan_id: { type: string }
            modules:
              type: array
              items: { type: string }
        employees:
          type: object
          properties:
            mode: { type: string, enum: [csv, manual] }
            csv_name: { type: string }
            rows:
              type: array
              items:
                type: object
                properties:
                  employee_no: { type: string }
                  first_name: { type: string }
                  last_name: { type: string }
                  email: { type: string }
                  tckn: { type: string }
                  position: { type: string }
                  department: { type: string }
                  hire_date: { type: string }
                  salary: { type: integer }
        org_chart:
          type: object
          properties:
            template: { type: string, enum: [flat, hierarchical, matrix] }
            departments:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  parent_id: { type: string }
                  manager: { type: string }
        sso:
          type: object
          properties:
            provider: { type: string, enum: [google, entra, okta, ""] }
            enabled: { type: boolean }
            client_id: { type: string }
            client_secret: { type: string }
            tenant_id: { type: string }
            domain: { type: string }
        kvkk:
          type: object
          properties:
            employee_notice_version: { type: string }
            candidate_notice_version: { type: string }
            visitor_notice_version: { type: string }
            dpo_name: { type: string }
            dpo_email: { type: string }
            dpo_phone: { type: string }
            verbis_ack: { type: boolean }
        payroll:
          type: object
          properties:
            sgk_workplace_code: { type: string }
            iban: { type: string }
            payment_day: { type: integer, minimum: 1, maximum: 31 }
            bank_name: { type: string }
        integrations:
          type: object
          properties:
            slack_enabled: { type: boolean }
            slack_webhook: { type: string }
            teams_enabled: { type: boolean }
            teams_webhook: { type: string }
            kariyer_net_url: { type: string }
        completed_steps:
          type: array
          items: { type: integer }
        template:
          type: string
          enum: [belediye, holding, tech, kobi, ""]
    OnboardingCommitResult:
      type: object
      required: [tenant_id, subscription_id, slug, draft_id]
      properties:
        tenant_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        slug: { type: string }
        draft_id: { type: string, format: uuid }
        trial_ends_at: { type: string, format: date-time, nullable: true }
    OnboardingFunnelAggregate:
      type: object
      required: [total, committed, abandoned, in_progress, per_step]
      properties:
        total: { type: integer }
        committed: { type: integer }
        abandoned: { type: integer }
        in_progress: { type: integer }
        per_step:
          type: object
          additionalProperties:
            type: object
            properties:
              reached: { type: integer }
              completed: { type: integer }
